name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK (x64)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          architecture: 'x64'

      - name: Setup .NET 10 SDK (x86)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          architecture: 'x86'

      - name: Restore Dependencies
        run: dotnet restore AppComercial.slnx

      - name: Build Solution
        run: dotnet build AppComercial.slnx --configuration Release --no-restore

      - name: Run Unit Tests
        run: >
          dotnet test AppComercial.UnitTests/AppComercial.UnitTests.csproj
          --configuration Release
          --no-build
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test_results.trx"
          --results-directory ./TestResults

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
          if-no-files-found: warn
