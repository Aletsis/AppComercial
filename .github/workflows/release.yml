name: CD Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión del lanzamiento (ej. 1.0.0 o v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Package & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: get_version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW_VERSION="${{ github.event.inputs.version }}"
          else
            RAW_VERSION="${{ github.ref_name }}"
          fi
          # Eliminar prefijo 'v' si está presente (ej. v1.0.0 -> 1.0.0)
          CLEAN_VERSION="${RAW_VERSION#v}"
          echo "Version determined: $CLEAN_VERSION"
          echo "version=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$CLEAN_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore AppComercial.slnx

      - name: Run Unit Tests
        run: dotnet test AppComercial.UnitTests/AppComercial.UnitTests.csproj --configuration Release --verbosity normal

      - name: Publish AppComercial.Api
        run: >
          dotnet publish AppComercial.Api/AppComercial.Api.csproj
          -c Release
          -r win-x86
          --self-contained false
          -o AppComercial.Api/bin/publish

      - name: Publish AppComercial.ServerManager
        run: >
          dotnet publish AppComercial.ServerManager/AppComercial.ServerManager.csproj
          -c Release
          -r win-x86
          --self-contained false
          -o AppComercial.ServerManager/bin/publish

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --no-progress --yes

      - name: Build Installer with Inno Setup
        shell: powershell
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue)
          if ($iscc) {
            $isccPath = $iscc.Source
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          } else {
            Write-Error "ISCC.exe no fue encontrado después de la instalación."
            exit 1
          }
          Write-Host "Compilando instalador con $isccPath..."
          & "$isccPath" /DMyAppVersion="${{ steps.get_version.outputs.version }}" Setup.iss

      - name: Verify Installer Generated
        shell: powershell
        run: |
          $installer = Get-ChildItem -Path ".\Releases" -Filter "AppComercial_Instalador_*.exe" | Select-Object -First 1
          if (-not $installer) {
            Write-Error "No se encontró el instalador generado en .\Releases"
            exit 1
          }
          Write-Host "Instalador generado exitosamente: $($installer.FullName) ($([math]::Round($installer.Length / 1MB, 2)) MB)"

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppComercial_Instalador_v${{ steps.get_version.outputs.version }}
          path: Releases/AppComercial_Instalador_*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: AppComercial ${{ steps.get_version.outputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            Releases/AppComercial_Instalador_*.exe
